spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse_flow_manager
    username: REMOVED_DB_USERNAME
    password: REMOVED_DB_PASSWORD
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080